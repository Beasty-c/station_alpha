; TerraForge export presets.
;
; Standard Godot 4.3 presets for the three desktop targets. Building any of
; them requires the matching export templates for the pinned engine version:
;
;   godot --headless --export-release "Linux/X11" build/TerraForge.x86_64
;
; Install templates once with:
;   godot --headless --install-export-templates
; or from the editor: Editor > Manage Export Templates > Download and Install.
;
; No preset embeds a signing identity, a notarisation credential or a store
; key. macOS and Windows builds produced from these presets are unsigned; sign
; them yourself with your own certificates before distributing.

[preset.0]

name="Linux/X11"
platform="Linux/X11"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../build/linux/TerraForge.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../build/windows/TerraForge.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
